# Caddy 基础设施容器（B 路线：tls internal 自签 HTTPS）
#
# 作用：统一对外入口，反向代理到各项目容器
# 特点：纯局域网 + 自签 HTTPS（无公网域名）
#   · Caddy 用内置本地 CA 签证书
#   · 每台客户端必须导入根证书，否则浏览器报安全警告
#   · itsaplan 用 NODE_ENV=production（HTTPS 下 Secure cookie 正常）
#
# 前置：docker network create proxy
services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"            # HTTP（自动跳转 443）
      - "443:443"          # HTTPS 入口
      - "443:443/udp"      # HTTP/3，可选
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data   # ★ 本地 CA 根证书存这里，必须持久化
      - caddy_config:/config
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  caddy_data:
  caddy_config:
