name: CodeQL

# OpenSSF Scorecard: SAST 检查
# GitHub 原生静态分析，无需第三方服务。
# Python 代码在 proto/ 和 dsh-plugin/，JS 在 dsh-plugin/。

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  schedule:
    # 每周一 03:00 UTC 扫描一次（捕捉新披露的漏洞模式）
    - cron: '0 3 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write   # 必须：上传 SARIF 到 Security 标签页
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2 # v3
        with:
          category: "/language:${{ matrix.language }}"
